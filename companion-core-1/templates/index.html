<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Companion AI</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
        header { margin-top: 15px; }
        select { padding: 6px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        #sprite-container { margin-top: 15px; text-align: center; }
        #sprite-img { width: 140px; height: 140px; object-fit: contain; border-radius: 50%; background: #1a1a1a; border: 2px solid #333; }
        #chat-box { width: 450px; height: 280px; border: 1px solid #333; background: #181818; overflow-y: scroll; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; border-radius: 6px; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .user-msg { background: #005fb8; align-self: flex-end; color: white; }
        .ai-msg { background: #2a2a2a; align-self: flex-start; color: #ddd; }
        #input-container { width: 450px; display: flex; margin-top: 10px; }
        #input-container input { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px 0 0 4px; outline: none; }
        #input-container button { padding: 10px 15px; background: #ff4d4d; border: none; color: white; border-radius: 0 4px 4px 0; cursor: pointer; }
        #minijuego-btn { margin-top: 12px; padding: 8px 12px; background: #252525; color: #aaa; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 12px; }
        #minijuego-btn:hover { background: #333; color: white; }
    </style>
</head>
<body>

    <header>
        <label for="selector-pj">Personaje: </label>
        <select id="selector-pj" onchange="cambiarPersonaje()">
            <option value="">Cargando...</option>
        </select>
    </header>

    <div id="sprite-container">
        <img id="sprite-img" src="/static/sprites/normal.png" alt="Avatar">
    </div>

    <div id="chat-box"></div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe algo..." autofocus>
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <button id="minijuego-btn" onclick="ganarMinijuego()">🎮 Jugar minijuego secreto (+15 afecto en secreto)</button>

    <script>
        function agregarAlChat(remitente, texto, claseCss) {
            const chatBox = document.getElementById("chat-box");
            if (!chatBox) return;
            const div = document.createElement("div");
            div.className = `message ${claseCss}`;
            div.innerHTML = `<strong>${remitente}:</strong> ${texto}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- NUEVO: CARGAR HISTORIAL AL ABRIR LA APP ---
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                let res = await fetch("/api/get_history");
                let history = await res.json();
                
                history.forEach(msg => {
                    // Diferenciamos si el mensaje es del usuario o de la IA para usar su clase correspondiente
                    if (msg.sender === "user") {
                        agregarAlChat("Tú", msg.text, "user-msg");
                    } else {
                        // Si el bot tiene un nombre guardado lo usamos, si no por defecto "Aoi"
                        let remitente = msg.character || "Aoi";
                        agregarAlChat(remitente, msg.text, "ai-msg");
                    }
                });
            } catch (err) {
                console.error("Error al cargar el historial:", err);
            }
        });
        // ----------------------------------------------

        window.onload = async function() {
            try {
                let res = await fetch("/api/personajes");
                let personajes = await res.json();
                let select = document.getElementById("selector-pj");
                if (!select) return;
                
                select.innerHTML = "";
                
                personajes.forEach(pj => {
                    let opt = document.createElement("option");
                    opt.value = pj;
                    opt.innerText = pj.toUpperCase();
                    select.appendChild(opt);
                });

                if (personajes.length > 0) {
                    cambiarPersonaje();
                }
            } catch (err) {
                console.error("Error al cargar personajes:", err);
            }
        };

        async function cambiarPersonaje() {
            let select = document.getElementById("selector-pj");
            if (!select) return;
            let pj = select.value;
            if (!pj) return;

            let res = await fetch("/api/cargar_personaje", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ personaje: pj })
            });
            let data = await res.json();
            if (data.status === "ok") {
                let spriteImg = document.getElementById("sprite-img");
                if (spriteImg) spriteImg.src = `/static/sprites/${data.initial_emotion}.png`;
                // (Opcional) Ya no limpiamos el chatBox entero al cambiar si quieres que persista el historial global
                agregarAlChat("Sistema", `Has iniciado sesión con ${data.name}.`, "ai-msg");
            }
        }

        async function enviarMensaje() {
            const inputField = document.getElementById("user-input");
            if (!inputField) return;
            const mensaje = inputField.value.trim();
            if (!mensaje) return;

            agregarAlChat("Tú", mensaje, "user-msg");
            inputField.value = "";

            try {
                let res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: mensaje })
                });
                let data = await res.json();

                if (data.response) {
                    agregarAlChat("Aoi", data.response, "ai-msg");
                    let spriteImg = document.getElementById("sprite-img");
                    if (spriteImg && data.emotion) {
                        spriteImg.src = `/static/sprites/${data.emotion}.png`;
                    }
                } else if (data.error) {
                    agregarAlChat("Sistema", data.error, "ai-msg");
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function ganarMinijuego() {
            let res = await fetch("/minijuego_ganado", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ puntos: 15 })
            });
            if (res.ok) {
                alert("✨ ¡Has ganado el minijuego! Su obsesión interna ha aumentado un poco más...");
            }
        }

        const userInputEl = document.getElementById("user-input");
        if (userInputEl) {
            userInputEl.addEventListener("keypress", function(e) {
                if (e.key === 'Enter') enviarMensaje();
            });
        }
    </script>
</body>
</html>
